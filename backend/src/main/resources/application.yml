spring:
  application:
    name: pearprogram-backend
  autoconfigure:
    exclude: org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/pearprogram}
    username: ${SPRING_DATASOURCE_USERNAME:pearprogram}
    password: ${SPRING_DATASOURCE_PASSWORD:pearprogram}
    hikari:
      maximum-pool-size: ${SPRING_DATASOURCE_MAX_POOL_SIZE:10}
      minimum-idle: ${SPRING_DATASOURCE_MIN_IDLE:1}
      connection-timeout: ${SPRING_DATASOURCE_CONNECTION_TIMEOUT_MS:10000}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    validate-migration-naming: true
  data:
    redis:
      repositories:
        enabled: false
      host: ${SPRING_REDIS_HOST:localhost}
      port: ${SPRING_REDIS_PORT:6379}
      password: ${SPRING_REDIS_PASSWORD:}
      ssl:
        enabled: ${SPRING_REDIS_SSL:false}
      timeout: ${SPRING_REDIS_TIMEOUT:10s}
      lettuce:
        pool:
          max-active: 8
          max-idle: 8
          min-idle: 0
          max-wait: ${SPRING_REDIS_POOL_MAX_WAIT:5s}
server:
  port: ${PORT:${SERVER_PORT:8081}}
  servlet:
    session:
      timeout: ${AUTH_SESSION_TIMEOUT:12h}
      cookie:
        http-only: true
        secure: ${AUTH_COOKIE_SECURE:false}
        same-site: ${AUTH_COOKIE_SAME_SITE:lax}

pearprogram:
  cors:
    allowed-origins: ${ALLOWED_ORIGINS:${PEARPROGRAM_CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173,http://localhost:5174,http://127.0.0.1:5174,https://*.vercel.app}}
  rooms:
    cleanup-grace-seconds: ${ROOM_CLEANUP_GRACE_SECONDS:120}
    cleanup-scan-ms: ${ROOM_CLEANUP_SCAN_MS:5000}
  redis:
    key-prefix: ${PEARPROGRAM_REDIS_KEY_PREFIX:pearprogram}
    connection-initial-delay-ms: ${PEARPROGRAM_REDIS_CONNECTION_INITIAL_DELAY_MS:5000}
    connection-retry-ms: ${PEARPROGRAM_REDIS_CONNECTION_RETRY_MS:30000}
  realtime:
    redis-broadcast-enabled: ${PEARPROGRAM_REALTIME_REDIS_BROADCAST_ENABLED:true}
    redis-broadcast-retry-ms: ${PEARPROGRAM_REALTIME_REDIS_BROADCAST_RETRY_MS:30000}
  ai:
    placeholder-mode: ${PEARPROGRAM_AI_PLACEHOLDER:false}
  auth:
    realtime-token-ttl: ${AUTH_REALTIME_TOKEN_TTL:10m}
    internal-service-token: ${INTERNAL_SERVICE_TOKEN:}
  execution:
    max-source-bytes: ${EXECUTION_MAX_SOURCE_BYTES:100000}
    max-stdin-bytes: ${EXECUTION_MAX_STDIN_BYTES:20000}
    rate-limit-per-minute: ${EXECUTION_RATE_LIMIT_PER_MINUTE:10}
    record-ttl: ${EXECUTION_RECORD_TTL:15m}
    poll-interval: ${JUDGE0_POLL_INTERVAL:750ms}
    deadline: ${JUDGE0_EXECUTION_DEADLINE:20s}
    max-poll-attempts: ${JUDGE0_MAX_POLL_ATTEMPTS:25}
    worker-threads: ${EXECUTION_WORKER_THREADS:4}
    judge0:
      base-url: ${JUDGE0_BASE_URL:http://localhost:2358}
      api-key: ${JUDGE0_API_KEY:}
      api-host: ${JUDGE0_API_HOST:}
      request-timeout: ${JUDGE0_REQUEST_TIMEOUT:5s}
      execution-timeout-seconds: ${JUDGE0_EXECUTION_TIMEOUT_SECONDS:5}
      max-retries: ${JUDGE0_MAX_RETRIES:2}
      retry-backoff: ${JUDGE0_RETRY_BACKOFF:200ms}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true
  health:
    redis:
      enabled: ${SPRING_REDIS_HEALTH_ENABLED:false}
  metrics:
    tags:
      application: pearprogram-backend

logging:
  level:
    com.pearprogram: INFO
