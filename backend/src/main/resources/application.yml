spring:
  application:
    name: pearprogram-backend
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:h2:file:./data/pearprogram;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH}
    username: ${SPRING_DATASOURCE_USERNAME:sa}
    password: ${SPRING_DATASOURCE_PASSWORD:}
    driver-class-name: ${SPRING_DATASOURCE_DRIVER:org.h2.Driver}
  data:
    redis:
      host: ${SPRING_REDIS_HOST:localhost}
      port: ${SPRING_REDIS_PORT:6379}
      timeout: 750ms
  flyway:
    enabled: ${SPRING_FLYWAY_ENABLED:false}
  h2:
    console:
      enabled: true
      path: /h2-console
  jpa:
    hibernate:
      ddl-auto: ${SPRING_JPA_HIBERNATE_DDL_AUTO:create}
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
server:
  port: 8080

pearprogram:
  jwt:
    secret: ${JWT_SECRET:dev-only-change-me-dev-only-change-me}
  rooms:
    ttl-hours: 24
  yjs:
    server-url: ${YJS_SERVER_URL:ws://localhost:1234}
  ai:
    placeholder-mode: ${PEARPROGRAM_AI_PLACEHOLDER:true}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true
  health:
    redis:
      enabled: ${SPRING_REDIS_HEALTH_ENABLED:false}
  metrics:
    tags:
      application: pearprogram-backend

logging:
  level:
    com.pearprogram: INFO
