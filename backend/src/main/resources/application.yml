spring:
  application:
    name: pearprogram-backend
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:h2:file:./data/pearprogram;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH}
    username: ${SPRING_DATASOURCE_USERNAME:sa}
    password: ${SPRING_DATASOURCE_PASSWORD:}
    driver-class-name: ${SPRING_DATASOURCE_DRIVER:org.h2.Driver}
  data:
    redis:
      host: ${SPRING_REDIS_HOST:localhost}
      port: ${SPRING_REDIS_PORT:6379}
      password: ${SPRING_REDIS_PASSWORD:}
      ssl:
        enabled: ${SPRING_REDIS_SSL:false}
      timeout: 750ms
  flyway:
    enabled: ${SPRING_FLYWAY_ENABLED:false}
  h2:
    console:
      enabled: true
      path: /h2-console
  jpa:
    hibernate:
      ddl-auto: ${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
server:
  port: ${SERVER_PORT:${PORT:8081}}

pearprogram:
  cors:
    allowed-origins: ${PEARPROGRAM_CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173,http://localhost:5174,http://127.0.0.1:5174,https://*.vercel.app}
  jwt:
    secret: ${JWT_SECRET:dev-only-change-me-dev-only-change-me}
  rooms:
    ttl-hours: 24
    cleanup-grace-seconds: ${ROOM_CLEANUP_GRACE_SECONDS:20}
    cleanup-scan-ms: ${ROOM_CLEANUP_SCAN_MS:5000}
  yjs:
    server-url: ${YJS_SERVER_URL:ws://localhost:1235}
  ai:
    placeholder-mode: ${PEARPROGRAM_AI_PLACEHOLDER:true}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true
  health:
    redis:
      enabled: ${SPRING_REDIS_HEALTH_ENABLED:false}
  metrics:
    tags:
      application: pearprogram-backend

logging:
  level:
    com.pearprogram: INFO
